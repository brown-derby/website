name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Validate approved image bindings and bytes
        run: npm run check:images

      - name: Verify review approval and persistence safeguards
        run: python3 -m unittest discover -s tools/image-review -p test_review.py

      - name: Build
        run: npm run build

      - name: Verify rendered SEO
        run: npm run check:seo
